spring.application.name=nubeplay-backend
server.port=${PORT:8080}

# ---------------------------------------------------------------
# Base de datos MySQL (la BD "nubeplay" se crea sola si no existe)
# Cambia usuario/clave con variables de entorno DB_USER / DB_PASSWORD
# o editando estos valores.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nubeplay?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------
# JWT
# app.jwt.secret: clave HMAC en Base64 (mínimo 256 bits). En producción
# se debe definir con la variable de entorno JWT_SECRET.
# ---------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:bnViZXBsYXktZHN5MTEwNC1jbGF2ZS1zdXBlci1zZWNyZXRhLWp3dC0yMDI2LWZ1bGxzdGFjaw==}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
app.jwt.issuer=nubeplay-api

# Inicio de sesión con Google: ID de cliente OAuth 2.0 (Google Cloud Console).
# Si está vacío, el endpoint /auth/google responde 503.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Orígenes permitidos (frontend Vite local y GitHub Pages)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,https://01100010-01101101.github.io}

# ---------------------------------------------------------------
# Swagger
# ---------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.paths-to-match=/api/v1/**
