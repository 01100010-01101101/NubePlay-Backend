# Perfil alternativo SIN MySQL (base de datos en memoria H2, se borra al detener el backend).
# Ejecutar con:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:nubeplay;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
